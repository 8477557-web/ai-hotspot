name: Daily AI Pipeline

on:
  schedule:
    # 北京时间每天早上8:00 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 手动触发

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt python-dateutil

      - name: Fetch RSS news
        run: python scripts/fetch_news.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: AI Pipeline (filter + score + crowd verify + topics + report)
        run: python scripts/main.py --ai-only --no-markdown
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Track history
        run: python scripts/history_tracker.py

      - name: Copy history to docs
        run: |
          mkdir -p docs/data/history
          cp data/history/*.json docs/data/history/ 2>/dev/null || true

      - name: Commit data back to repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/history/ docs/data/history/
          for f in docs/data/selected_news.json docs/data/daily_report.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "daily: $(date +%Y-%m-%d)"
            git push origin main
          fi
